<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan</title>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.suggestions {
  text-align: left;
  border: 1px solid #ccc;
  border-top: none;
  max-height: 150px;
  overflow-y: auto;
}

.suggestions div {
  padding: 10px;
  cursor: pointer;
}

.suggestions div:hover {
  background: #f1f1f1;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
}

.lulus { background: #d4edda; }
.tidak { background: #f8d7da; }

.animasi {
  font-size: 20px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🎓 Pengumuman Kelulusan</h2>
  <div id="countdown"></div>

  <input type="text" id="nama" placeholder="Ketik nama Anda..." autocomplete="off">
  <div id="suggestions" class="suggestions"></div>

  <div id="result"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwigDticvprrUY6eOdf6iOiZ_VqYQ9J1K4n8yfd0QuCyw9vZpkFC8S6wxNfpIHLzNM/exec";

let semuaData = [];

// ⏰ COUNTDOWN
const target = new Date("2026-05-01T19:00:00+08:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const selisih = target - now;

  if (selisih <= 0) {
    document.getElementById("countdown").innerHTML = "🔓 Dibuka";
    loadData();
    return;
  }

  const jam = Math.floor(selisih / 3600000);
  const menit = Math.floor((selisih % 3600000) / 60000);
  const detik = Math.floor((selisih % 60000) / 1000);

  document.getElementById("countdown").innerHTML =
    `⏳ ${jam}j ${menit}m ${detik}d`;
}, 1000);

// 🔄 LOAD DATA SEKALI
function loadData() {
  if (semuaData.length > 0) return;

  Swal.fire({
    title: 'Memuat data...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  fetch(API_URL + "?mode=all")
    .then(res => res.json())
    .then(data => {
      semuaData = data;
      Swal.close();
    });
}

// 🔍 AUTOCOMPLETE
document.getElementById("nama").addEventListener("keyup", function() {
  const value = this.value.toLowerCase();
  const box = document.getElementById("suggestions");

  if (value.length < 2) {
    box.innerHTML = "";
    return;
  }

  const hasil = semuaData.filter(d =>
    d.nama.toLowerCase().includes(value)
  );

  let html = "";
  hasil.slice(0, 10).forEach(d => {
    html += `<div onclick="pilihNama('${d.nama}')">${d.nama}</div>`;
  });

  box.innerHTML = html;
});

// 🎯 PILIH NAMA
function pilihNama(nama) {
  document.getElementById("nama").value = nama;
  document.getElementById("suggestions").innerHTML = "";

  Swal.fire({
    title: 'Mencari...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  setTimeout(() => {
    const data = semuaData.find(d => d.nama === nama);
    tampilkan(data);
    Swal.close();
  }, 500);
}

// 🎨 HASIL
function tampilkan(d) {
  let kelas = d.status === "LULUS" ? "lulus" : "tidak";
  let animasi = d.status === "LULUS"
    ? "🎉 Selamat Anda LULUS!"
    : "Tetap semangat 💪";

  document.getElementById("result").innerHTML = `
    <div class="result ${kelas}">
      <h3>${d.nama}</h3>
      <p>Status: <b>${d.status}</b></p>
      <p>${d.keterangan}</p>
      <div class="animasi">${animasi}</div>
    </div>
  `;
}
</script>

</body>
</html>
