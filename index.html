<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin: 0;
  padding: 20px;
  color: #333;
}

.container {
  max-width: 500px;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
}

.lulus {
  background: #d4edda;
  color: #155724;
}

.tidak {
  background: #f8d7da;
  color: #721c24;
}

#countdown {
  font-weight: bold;
  margin: 15px 0;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 15px;
  font-size: 14px;
}

.stat-box {
  background: #f1f1f1;
  padding: 10px;
  border-radius: 10px;
  width: 30%;
}

.animasi {
  font-size: 22px;
  margin-top: 15px;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
  <h2>🎓 Pengumuman Kelulusan</h2>
  <p>Senin, 19.00 WITA</p>

  <div id="countdown"></div>

  <div id="searchBox" style="display:none;">
    <input type="text" id="nama" placeholder="Ketik nama Anda...">
  </div>

  <div id="result"></div>

  <!-- Statistik -->
  <div class="stats" id="stats">
    <div class="stat-box">Total: -</div>
    <div class="stat-box">Lulus: -</div>
    <div class="stat-box">Tidak: -</div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/XXXX/exec";

// ⏰ SET TANGGAL
const target = new Date("2026-05-04T19:00:00+08:00").getTime();

const countdownEl = document.getElementById("countdown");
const searchBox = document.getElementById("searchBox");
const input = document.getElementById("nama");

// COUNTDOWN
setInterval(() => {
  const now = new Date().getTime();
  const selisih = target - now;

  if (selisih <= 0) {
    countdownEl.innerHTML = "🔓 Pengumuman dibuka";
    searchBox.style.display = "block";
    loadStat();
    return;
  }

  const jam = Math.floor(selisih / (1000 * 60 * 60));
  const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
  const detik = Math.floor((selisih % (1000 * 60)) / 1000);

  countdownEl.innerHTML = `⏳ ${jam}j ${menit}m ${detik}d`;
}, 1000);

// 🔍 AUTO SEARCH
input.addEventListener("keyup", function() {
  const nama = input.value;
  if (nama.length < 2) return;

  fetch(API_URL + "?nama=" + nama)
    .then(res => res.json())
    .then(data => tampilkan(data));
});

// 🎨 TAMPILKAN HASIL
function tampilkan(data) {
  const el = document.getElementById("result");

  if (data.length === 0) {
    el.innerHTML = "<p>Data tidak ditemukan</p>";
    return;
  }

  let d = data[0];

  let kelas = d.status === "LULUS" ? "lulus" : "tidak";
  let animasi = d.status === "LULUS"
    ? `<div class="animasi">🎉 Selamat Anda LULUS!</div>`
    : `<div class="animasi">Tetap semangat 💪</div>`;

  el.innerHTML = `
    <div class="result ${kelas}">
      <h3>${d.nama}</h3>
      <p>Status: <b>${d.status}</b></p>
      <p>${d.keterangan}</p>
      ${animasi}
    </div>
  `;
}

// 📊 LOAD STATISTIK
function loadStat() {
  fetch(API_URL + "?mode=stat")
    .then(res => res.json())
    .then(d => {
      document.getElementById("stats").innerHTML = `
        <div class="stat-box">Total<br><b>${d.total}</b></div>
        <div class="stat-box">Lulus<br><b>${d.lulus}</b></div>
        <div class="stat-box">Tidak<br><b>${d.tidak}</b></div>
      `;
    });
}
</script>

</body>
</html>
