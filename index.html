<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan</title>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Animate CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #003366, #0059b3);
  margin: 0;
  padding: 20px;
}

/* COUNTDOWN BOX */
.countdown-box {
  display: flex;
  justify-content: space-between;
  margin: 15px 0;
}

.time {
  background: #003366;
  color: white;
  padding: 10px;
  border-radius: 10px;
  width: 22%;
}

.time span {
  display: block;
  font-size: 18px;
  font-weight: bold;
  animation: blink 1s infinite;
}

.label {
  font-size: 12px;
  margin-top: 5px;
}

/* EFEK KEDIP */
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* HEADER */
.header {
  background: #003366;
  color: white;
  text-align: center;
  padding: 20px;
}

.header img {
  width: 70px;
  margin-bottom: 10px;
}

.header h2 {
  margin: 5px 0;
  font-size: 18px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

/* CONTENT */
.content {
  padding: 20px;
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* AUTOCOMPLETE FIX */
.suggestions {
  position: relative;
}

.suggestions-list {
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  border-radius: 0 0 8px 8px;
}

.suggestions-list div {
  padding: 10px;
  cursor: pointer;
}

.suggestions-list div:hover {
  background: #f1f1f1;
}

/* RESULT */
.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
}

.lulus {
  background: #d4edda;
  color: #155724;
}

.tidak {
  background: #f8d7da;
  color: #721c24;
}

.animasi {
  font-size: 20px;
  margin-top: 10px;
  font-weight: bold;
}

/* COUNTDOWN */
#countdown {
  margin-bottom: 15px;
  font-weight: bold;
}

.countdown-simple {
  margin: 10px 0 15px;
  font-size: 14px;
  color: #003366;
}

#timeText {
  font-size: 18px;
  font-weight: bold;
  margin-top: 5px;
  animation: blinkSoft 1.2s infinite;
}

/* kedip halus */
@keyframes blinkSoft {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.progress-container {
  width: 100%;
  height: 6px;
  background: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #003366, #0059b3);
  transition: width 1s linear;
}
.lulus-text {
  font-size: 26px;
  font-weight: bold;
  color: #dd2222;
  animation: scaleUp 0.6s ease, glow 1s infinite alternate;
  margin-top: 10px;
}

@keyframes scaleUp {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes glow {
  from { text-shadow: 0 0 5px #28a745; }
  to { text-shadow: 0 0 20px #28a745; }
}

.swal2-popup.custom-popup {
  border-radius: 18px !important;
  padding: 20px !important;
  background: linear-gradient(135deg, #ffffff, #f0f6ff) !important;
  box-shadow: 0 15px 40px rgba(0, 51, 102, 0.25) !important;
  border: 1px solid rgba(0, 89, 179, 0.15);
}

/* logo */
.popup-logo {
  width: 75px;
  margin-bottom: 10px;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
}

/* judul */
.popup-title {
  font-size: 20px;
  font-weight: bold;
  color: #003366;
  margin-bottom: 10px;
}

/* isi */
.popup-content {
  text-align: left;
  font-size: 14px;
  line-height: 1.7;
  color: #333;
}

/* footer */
.popup-footer {
  margin-top: 15px;
  font-weight: bold;
  text-align: center;
  color: #003366;
  padding-top: 10px;
  border-top: 1px dashed #ccc;
}

/* list */
.popup-content ol {
  padding-left: 18px;
}

.popup-content li {
  margin-bottom: 6px;
}

/* tombol */
.swal2-confirm {
  border-radius: 10px !important;
  font-weight: bold;
  padding: 10px 20px;
  box-shadow: 0 5px 15px rgba(0, 89, 179, 0.3);
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER SEKOLAH -->
  <div class="header">
    <img src="https://i.ibb.co.com/sdV75wcH/Logo.png">
    <h2>SMK BINTANG PERSADA DENPASAR</h2>
    <p>Pengumuman Kelulusan Tahun 2026</p>
  </div>
  <div class="content">

    <div id="countdown" class="countdown-simple">
        ⏳ Dibuka dalam:
        <div id="timeText"></div>
    </div>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>

    <div id="searchSection" style="display:none;">
        <div class="suggestions">
        <input type="text" id="nama" placeholder="Masukkan Nama Anda..." autocomplete="off">
        <div id="suggestions" class="suggestions-list"></div>
        </div>
    </div>

    <!-- ✅ WAJIB ADA -->
    <div id="result"></div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwigDticvprrUY6eOdf6iOiZ_VqYQ9J1K4n8yfd0QuCyw9vZpkFC8S6wxNfpIHLzNM/exec";

let confettiInterval = null;
let semuaData = [];

// ⏰ COUNTDOWN
const target = new Date("2026-05-04T19:00:00+08:00").getTime();

// ⏪ ambil waktu mulai (saat halaman dibuka)
const start = new Date().getTime();

let sudahDibuka = false;

setInterval(() => {
  const now = new Date().getTime();
  const selisih = target - now;

  // ⏳ HITUNG PROGRESS
  const totalDurasi = target - start;
  const berjalan = now - start;
  let persen = (berjalan / totalDurasi) * 100;
  if (persen > 100) persen = 100;

  document.getElementById("progressBar").style.width = persen + "%";

  // 🔓 JIKA SUDAH WAKTU
  if (selisih <= 0) {
    document.getElementById("countdown").innerHTML = "🔓 Pengumuman Dibuka";

    // tampilkan search (hanya sekali)
    if (!sudahDibuka) {
      document.getElementById("searchSection").style.display = "block";
      loadData();
      sudahDibuka = true;
    }

    return;
  }

  // ⏱ HITUNG WAKTU
  const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
  const jam = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
  const detik = Math.floor((selisih % (1000 * 60)) / 1000);

  document.getElementById("timeText").innerText =
    `${hari} Hari ${jam} Jam ${menit} Menit ${detik} Detik`;

}, 1000);

// 🔄 LOAD DATA
function loadData() {
  if (semuaData.length > 0) return;

  Swal.fire({
    title: 'Memuat data...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  fetch(API_URL + "?mode=all")
    .then(res => res.json())
    .then(data => {
      semuaData = data;
      Swal.close();
    });
}

// 🔍 AUTOCOMPLETE
document.getElementById("nama").addEventListener("keyup", function() {

  // 🚫 blok sebelum waktu dibuka
  if (!sudahDibuka) {
    return;
  }
  const box = document.getElementById("suggestions");

    if (semuaData.length === 0) {
    box.innerHTML = "<div>Memuat data...</div>";
    return;
    }

  const value = this.value.toLowerCase();

  if (value.length < 2) {
    box.innerHTML = "";
    return;
  }

  const hasil = semuaData.filter(d =>
    d.nama.toLowerCase().includes(value)
  );

  let html = "";
  hasil.slice(0, 10).forEach(d => {
    html += `<div onclick="pilihNama('${d.nama}')">${d.nama}</div>`;
  });

  box.innerHTML = html;
});

// 🎯 PILIH NAMA
function pilihNama(nama) {
  document.getElementById("nama").value = nama;
  document.getElementById("suggestions").innerHTML = "";

  Swal.fire({
    title: 'Memproses...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  setTimeout(() => {
    const data = semuaData.find(d => d.nama === nama);
    tampilkan(data);
    Swal.close();
  }, 500);
}

// 🎨 HASIL + FIREWORKS
function tampilkan(d) {
  const el = document.getElementById("result");
  if (!el) return;

  const status = d.status.trim().toUpperCase();
  if (status === "LULUS") {
    startFireworks();
    } else {
    stopFireworks();
    }
  const kelas = status === "LULUS" ? "lulus" : "tidak";

    let animasiLulus = "";
    let pesan = `<div class="animasi">Tetap semangat, terus berkarya dan raihlah cita-citamu setinggi mungkin</div>`;

    // kalau lulus, tambahkan animasi khusus
    if (status === "LULUS") {
    animasiLulus = `<div class="lulus-text">🎉 LULUS 🎉</div>`;
    startFireworks();
    } else {
    stopFireworks();
    }

    el.innerHTML = `
    <div class="result ${status === "LULUS" ? "lulus" : "tidak"}">
        <h3>${d.nama}</h3>
        <p>Anda dinyatakan</b></p>
        ${animasiLulus}
        <p>${d.keterangan}</p>

        
        ${pesan}

    </div>
    `;

  // 🔍 DEBUG (boleh hapus nanti)
  console.log("STATUS FINAL:", status);

  // 🎆 CONFETTI (FIX)
  if (status === "LULUS" && typeof confetti === "function") {

    // delay sedikit biar lebih dramatis
    setTimeout(() => {

      const duration = 2000;
      const end = Date.now() + duration;

      const interval = setInterval(() => {
        if (Date.now() > end) {
          clearInterval(interval);
          return;
        }

        confetti({
          particleCount: 80,
          spread: 120,
          startVelocity: 45,
          origin: {
            x: Math.random(),
            y: Math.random() - 0.2
          }
        });

      }, 250);

    }, 300);
  }
}

function startFireworks() {
  if (confettiInterval) return;

  const endTime = Date.now() + 25000;

  confettiInterval = setInterval(() => {
    if (Date.now() > endTime) {
      stopFireworks();
      return;
    }

    confetti({
      particleCount: 80,
      spread: 160,
      angle: Math.random() * 360
    });

  }, 300);
}

function stopFireworks() {
  if (confettiInterval) {
    clearInterval(confettiInterval);
    confettiInterval = null;
  }
}

window.addEventListener("load", () => {
  fetch(API_URL + "?mode=all")
    .then(res => res.json())
    .then(data => {
      semuaData = data;
      console.log("Data loaded:", semuaData.length);
    });
});
</script>
<script>
function testConfetti() {
  if (typeof confetti !== "function") {
    alert("Confetti gagal load ❌");
    return;
  }

  confetti({
    particleCount: 200,
    spread: 120,
    origin: { y: 0.6 }
  });
}

// Himbauan Kelulusan
window.addEventListener("load", () => {

  if (!localStorage.getItem("popup_kelulusan_2026")) {

    Swal.fire({
      customClass: {
        popup: 'custom-popup'
      },

      // 🔥 ANIMASI MASUK & KELUAR
      showClass: {
        popup: 'animate__animated animate__zoomIn'
      },
      hideClass: {
        popup: 'animate__animated animate__fadeOut'
      },

      html: `
        <div style="text-align:center;">
          <img src="https://i.ibb.co.com/sdV75wcH/Logo.png" class="popup-logo">
          <div class="popup-title">Himbauan Kelulusan</div>
        </div>

        <div class="popup-content">
          <ol>
            <li>Pantau kelulusan dari rumah</li>
            <li>Tidak ada konvoi kendaraan</li>
            <li>Tidak ada corat-coret</li>
            <li>Simpan seragam atau berikan pada yang membutuhkan</li>
            <li>Kelulusan ini bukanlah akhir dari segalanya, namun ini adalah awal dari perjalanan kalian untuk kejenjang yang lebih tinggi lagi.</li>
            <li>Kami harapkan kalian tetap bisa menjaga nama baik sendiri, keluarga dan almamater kalian.</li>
          </ol>
        </div>

        <div class="popup-footer">
          Rayakan Kelulusan dengan kegiatan-kegiatan positif dan tidak merugikan orang lain.
        </div>
      `,

      confirmButtonText: "Saya Mengerti",
      confirmButtonColor: "#003366",
      allowOutsideClick: false,
      width: 420

    }).then(() => {
      localStorage.setItem("popup_kelulusan_2026", "true");
    });

  }

});
</script>

</body>
</html>
